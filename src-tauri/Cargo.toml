[package]
name = "arknote"
version = "1.0.0"
description = "ArkNote desktop sticky notes"
authors = ["ArkNote"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
base64 = "0.22"
tauri = { version = "2.11.3", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
